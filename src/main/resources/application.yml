spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/doctor_booking
    username: doctor_user
    password: doctor_pass

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect